<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>netsi-marked NPM example</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="https://unpkg.com/netsi-marked@0.1.2/styles/netsi-marked.css" />
    <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.11.1/styles/github.min.css" />
    <style>
      :root {
        --demo-accent: #0a67dd;
        --demo-accent-2: #38bdf8;
        --demo-surface: #f8fafc;
        --demo-border: #d8dee7;
      }

      body {
        margin: 0;
        padding: clamp(1rem, 3vw, 2rem);
        font-family: 'IBM Plex Sans', sans-serif;
        background:
          radial-gradient(circle at 100% 0%, #dbeafe 0%, transparent 38%),
          radial-gradient(circle at 0% 100%, #e2f3ff 0%, transparent 32%),
          #f6f8fb;
      }

      .demo-shell {
        display: grid;
        gap: 1rem;
        margin-inline: auto;
        max-width: 1100px;
      }

      .demo-intro {
        display: grid;
        gap: 0.7rem;
        border: 1px solid color-mix(in srgb, var(--demo-border) 80%, white);
        border-radius: 1rem;
        background: linear-gradient(140deg, rgb(255 255 255 / 86%), rgb(244 249 255 / 96%));
        box-shadow: 0 10px 28px rgb(9 20 46 / 8%);
        padding: 0.9rem 1rem;
      }

      .demo-repo-link {
        color: var(--demo-accent);
        font-weight: 700;
        text-decoration: none;
      }

      .demo-repo-link:hover {
        text-decoration: underline;
      }

      .demo-usage {
        margin: 0;
        border: 1px solid color-mix(in srgb, var(--demo-border) 76%, white);
        border-radius: 0.8rem;
        background: color-mix(in srgb, white 80%, #eaf2ff);
        color: #0f172a;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.83rem;
        line-height: 1.5;
        overflow: auto;
        padding: 0.75rem 0.85rem;
      }

      .demo-controls {
        display: flex;
        align-items: center;
      }

      .headless-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.95rem;
        border: 1px solid color-mix(in srgb, var(--demo-border) 78%, white);
        border-radius: 999px;
        background: linear-gradient(135deg, rgb(255 255 255 / 90%), rgb(237 246 255 / 92%));
        padding: 0.45rem 0.5rem 0.45rem 0.95rem;
        box-shadow:
          0 10px 28px rgb(2 12 27 / 10%),
          inset 0 1px 0 rgb(255 255 255 / 60%);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .headless-toggle:hover {
        transform: translateY(-1px);
        box-shadow:
          0 13px 30px rgb(2 12 27 / 12%),
          inset 0 1px 0 rgb(255 255 255 / 60%);
      }

      .headless-toggle input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .headless-toggle__label {
        display: grid;
        gap: 0.12rem;
      }

      .headless-toggle__title {
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 0.008em;
      }

      .headless-toggle__hint {
        color: #445068;
        font-size: 0.74rem;
      }

      .headless-toggle__track {
        inline-size: 3rem;
        block-size: 1.7rem;
        border-radius: 999px;
        border: 1px solid color-mix(in srgb, var(--demo-border) 75%, white);
        background: linear-gradient(120deg, #e4ecf8, #d8e4f4);
        position: relative;
        transition: background 180ms ease;
      }

      .headless-toggle__track::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 1px 2px rgb(2 12 27 / 12%);
      }

      .headless-toggle__thumb {
        position: absolute;
        inset-block-start: 0.12rem;
        inset-inline-start: 0.12rem;
        inline-size: 1.35rem;
        block-size: 1.35rem;
        border-radius: 999px;
        background: linear-gradient(140deg, #ffffff, #f5f8ff);
        box-shadow: 0 2px 10px rgb(2 12 27 / 24%);
        transition: transform 180ms ease;
      }

      .headless-toggle input:checked + .headless-toggle__label + .headless-toggle__track {
        background: linear-gradient(120deg, color-mix(in srgb, var(--demo-accent) 56%, white), color-mix(in srgb, var(--demo-accent-2) 52%, white));
      }

      .headless-toggle input:checked + .headless-toggle__label + .headless-toggle__track .headless-toggle__thumb {
        transform: translateX(1.3rem);
      }

      .headless-toggle input:focus-visible + .headless-toggle__label + .headless-toggle__track {
        outline: 3px solid color-mix(in srgb, var(--demo-accent) 35%, transparent);
        outline-offset: 2px;
      }

      /* Fallback: emulate headless mode for published versions that do not support the attribute yet. */
      netsi-marked[headless]::part(toolbar) {
        display: none;
      }

      netsi-marked[headless]::part(wrapper) {
        border: 0;
        border-radius: 0;
        background: transparent;
        overflow: visible;
      }

      netsi-marked[headless]::part(content-slot) {
        padding: clamp(0.65rem, 1.8vw, 1.2rem);
      }
    </style>
    <script type="module">
      import 'https://esm.sh/netsi-marked';

      await customElements.whenDefined('netsi-marked');
      const element = document.querySelector('netsi-marked');
      const markdownTemplate = document.getElementById('demo-markdown');
      const headlessToggle = document.getElementById('headless-toggle');
      element.markdown = markdownTemplate.textContent.trim();

      const syncHeadlessMode = () => {
        const enabled = headlessToggle.checked;
        element.toggleAttribute('headless', enabled);
        element.toggleAttribute('plain', enabled);
      };

      headlessToggle.addEventListener('change', syncHeadlessMode);
      syncHeadlessMode();
    </script>
  </head>
  <body>
    <script id="demo-markdown" type="text/markdown">
# My Big TOE inspired markdown demo

This test content is inspired by Thomas Campbell's *My Big TOE* vocabulary: consciousness, intent, entropy, feedback, probability, and virtual reality.

> [!NOTE]
> This demo is not an official summary of Thomas Campbell's work. It is sample markdown for testing rendering features.

## Consciousness feedback loop

```mermaid
flowchart TD
  A[Consciousness unit] --> B[Intent]
  B --> C[Choice]
  C --> D[Feedback]
  D --> E{Lower entropy?}
  E -- Yes --> F[More coherent interaction]
  E -- No --> G[Learn from consequence]
  F --> A
  G --> A
```

## Probability and decision space

```mermaid
stateDiagram-v2
  [*] --> CurrentExperience
  CurrentExperience --> ChoiceA: Caring intent
  CurrentExperience --> ChoiceB: Fear-based intent
  ChoiceA --> LowerEntropy
  ChoiceB --> HigherEntropy
  LowerEntropy --> Feedback
  HigherEntropy --> Feedback
  Feedback --> CurrentExperience
```

## Code formatting examples

JavaScript:

```js
const intent = 'coherent';
const entropyTrend = intent === 'coherent' ? 'lowering' : 'increasing';
console.log({ intent, entropyTrend });
```

HTML:

```html
<netsi-marked plugins="mermaid,code-enhance,callouts" locale="da">
  <template type="text/markdown">
# Hello virtual reality
  </template>
</netsi-marked>
```

CSS:

```css
netsi-marked {
  --netsi-marked-accent: #6f42c1;
  --netsi-marked-radius: 1rem;
}
```

## Table

| MBT term | Demo interpretation |
|---|---|
| Intent | Direction behind a choice |
| Feedback | Consequence data |
| Entropy | Coherence or disorder trend |
    </script>
    <main class="demo-shell">
      <h1>NPM usage</h1>
      <section class="demo-intro" aria-label="Repository and usage">
        <a class="demo-repo-link" href="https://github.com/netsi1964/netsi-marked" target="_blank" rel="noopener noreferrer">Open repository: github.com/netsi1964/netsi-marked</a>
        <pre class="demo-usage"><code>npm install netsi-marked
import 'netsi-marked';

&lt;netsi-marked plugins="callouts,mermaid,code-enhance,heading-anchors"&gt;&lt;/netsi-marked&gt;</code></pre>
      </section>
      <div class="demo-controls">
        <label class="headless-toggle" for="headless-toggle">
          <input id="headless-toggle" type="checkbox" checked />
          <span class="headless-toggle__label">
            <span class="headless-toggle__title">Headless mode</span>
            <span class="headless-toggle__hint">Minimal chrome, pure content</span>
          </span>
          <span class="headless-toggle__track" aria-hidden="true"><span class="headless-toggle__thumb"></span></span>
        </label>
      </div>
      <netsi-marked plugins="callouts,mermaid,code-enhance,heading-anchors"></netsi-marked>
    </main>
  </body>
</html>
